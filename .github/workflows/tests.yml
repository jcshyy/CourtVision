name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install cfn-lint==1.54.0
      - run: cfn-lint deploy/aws/template.yaml
      - run: python -m unittest discover -s tests -v
      - run: docker build -f Dockerfile.api -t courtvision-api:test .
