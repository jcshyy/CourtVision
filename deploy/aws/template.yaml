AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CourtVision public-preview web application and job-control plane

Parameters:
  ApiRuntime:
    Type: String
    Default: Lambda
    AllowedValues: [Flask, Lambda]
    Description: Select the cost-optimized Lambda API or the optional always-on Flask service.
  ApiImageUri:
    Type: String
    Default: unused-for-lambda
    Description: ECR image URI built from Dockerfile.api; required only when ApiRuntime=Flask.
  WorkerImageUri:
    Type: String
    Description: ECR image URI built from Dockerfile.
  EnableCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the S3 and CloudFront web tier; disable when the static site is hosted externally.
  CustomDomainName:
    Type: String
    Default: ""
    Description: Optional CloudFront alias, for example courtvision.video.
  CloudFrontCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:000000000000:certificate/unused
    AllowedPattern: "^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/.+$"
    Description: Optional us-east-1 ACM certificate ARN for CustomDomainName.
  AllowedWebOrigin:
    Type: String
    Default: https://courtvision.video
    Description: Browser origin allowed to upload and retrieve private artifacts.
  ApiCustomDomainName:
    Type: String
    Default: ""
    Description: Optional regional API Gateway hostname, for example api.courtvision.video.
  ApiCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:000000000000:certificate/unused
    AllowedPattern: "^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/.+$"
    Description: Optional us-east-1 ACM certificate ARN for ApiCustomDomainName.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: CommaDelimitedList
    Default: subnet-00000000000000000,subnet-00000000000000001
    Description: At least two public subnets for ALB/Fargate; used only when ApiRuntime=Flask.
  WorkerSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets with ECR, S3, DynamoDB, and CloudWatch Logs egress for Batch workers.
  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-00000000
    AllowedPattern: "^pl-[a-f0-9]+$"
    Description: CloudFront origin-facing prefix-list ID; required only when ApiRuntime=Flask.
  BatchInstanceType:
    Type: String
    Default: g4dn.xlarge
    AllowedPattern: "^[a-z0-9]+[a-z0-9.-]*$"
  BatchMaxVcpus:
    Type: Number
    Default: 4
    MinValue: 4
    MaxValue: 64
  ApiDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  MaxUploadBytes:
    Type: Number
    Default: 524288000
  MaxDurationSeconds:
    Type: Number
    Default: 30
  TargetFps:
    Type: Number
    Default: 30
  MaxWidth:
    Type: Number
    Default: 1280
  BallDetectorBackend:
    Type: String
    Default: hybrid
    AllowedValues: [yolo, wasb, hybrid]
    Description: Hybrid keeps E-BARD semantics while using WASB for ball localization.
  ResultRetentionSeconds:
    Type: Number
    Default: 86400
  ArtifactRetentionDays:
    Type: Number
    Default: 1
    Description: S3 lifecycle backstop; keep aligned with ResultRetentionSeconds (whole days).
  ReportRetentionSeconds:
    Type: Number
    Default: 7776000

Rules:
  CustomDomainInputs:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - !Equals [!Ref CustomDomainName, ""]
                - !Equals [!Ref CloudFrontCertificateArn, arn:aws:acm:us-east-1:000000000000:certificate/unused]
            - Fn::And:
                - !Not [!Equals [!Ref CustomDomainName, ""]]
                - !Not [!Equals [!Ref CloudFrontCertificateArn, arn:aws:acm:us-east-1:000000000000:certificate/unused]]
        AssertDescription: CustomDomainName and CloudFrontCertificateArn must be supplied together.
  ApiDomainInputs:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - !Equals [!Ref ApiCustomDomainName, ""]
                - !Equals [!Ref ApiCertificateArn, arn:aws:acm:us-east-1:000000000000:certificate/unused]
            - Fn::And:
                - !Not [!Equals [!Ref ApiCustomDomainName, ""]]
                - !Not [!Equals [!Ref ApiCertificateArn, arn:aws:acm:us-east-1:000000000000:certificate/unused]]
        AssertDescription: ApiCustomDomainName and ApiCertificateArn must be supplied together.
  FlaskRuntimeInputs:
    RuleCondition: !Equals [!Ref ApiRuntime, Flask]
    Assertions:
      - Assert: !Not [!Equals [!Ref ApiImageUri, unused-for-lambda]]
        AssertDescription: ApiRuntime=Flask requires a deployable ApiImageUri.
      - Assert:
          Fn::Not:
            - Fn::Contains:
                - !Ref PublicSubnetIds
                - subnet-00000000000000000
        AssertDescription: ApiRuntime=Flask requires real PublicSubnetIds.
      - Assert: !Not [!Equals [!Ref CloudFrontOriginPrefixListId, pl-00000000]]
        AssertDescription: ApiRuntime=Flask requires the regional CloudFront origin prefix-list ID.
  ExternalHostingRuntime:
    RuleCondition: !Equals [!Ref EnableCloudFront, "false"]
    Assertions:
      - Assert: !Equals [!Ref ApiRuntime, Lambda]
        AssertDescription: External static hosting currently requires the Lambda API runtime.

Conditions:
  UseFlaskApi: !Equals [!Ref ApiRuntime, Flask]
  UseLambdaApi: !Not [!Condition UseFlaskApi]
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  UseCustomDomain: !And
    - !Condition UseCloudFront
    - !Not [!Equals [!Ref CustomDomainName, ""]]
  UseApiCustomDomain: !And
    - !Condition UseLambdaApi
    - !Not [!Equals [!Ref ApiCustomDomainName, ""]]

Globals:
  Function:
    Runtime: python3.14
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: production

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [POST, GET, HEAD]
            AllowedOrigins: [!Ref AllowedWebOrigin]
            ExposedHeaders: [ETag]
            MaxAge: 900
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePrivateBetaArtifacts
            Status: Enabled
            ExpirationInDays: !Ref ArtifactRetentionDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ModelBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebBucket:
    Type: AWS::S3::Bucket
    Condition: UseCloudFront
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: ownerEmail
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OwnerCreatedAtIndex
          KeySchema:
            - AttributeName: ownerEmail
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC secret for CourtVision analysis sessions and email codes.
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 64

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UserPoolTier: LITE
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Confirm your CourtVision account
        EmailMessage: "Your CourtVision confirmation code is {####}."
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Condition: UseLambdaApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowCredentials: true
        AllowHeaders:
          - Content-Type
          - X-CourtVision-CSRF
        AllowMethods:
          - GET
          - HEAD
          - OPTIONS
          - POST
        AllowOrigins:
          - !Ref AllowedWebOrigin
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Condition: UseLambdaApi
    Properties:
      RetentionInDays: 30

  WebApiFunction:
    Type: AWS::Serverless::Function
    Condition: UseLambdaApi
    Properties:
      CodeUri: ../../backend/lambda_api
      Handler: web_api.lambda_handler
      Environment:
        Variables:
          API_PREFIX: /api
          ALLOWED_WEB_ORIGIN: !Ref AllowedWebOrigin
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
          JOBS_TABLE: !Ref JobsTable
          REPORTS_TABLE: !Ref ReportsTable
          SESSION_SECRET_ARN: !Ref SessionSecret
          BATCH_JOB_QUEUE: !Ref GpuJobQueue
          BATCH_JOB_DEFINITION: !Ref WorkerJobDefinition
          MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
          MAX_DURATION_SECONDS: !Ref MaxDurationSeconds
          TARGET_FPS: !Ref TargetFps
          MAX_WIDTH: !Ref MaxWidth
          RESULT_RETENTION_SECONDS: !Ref ResultRetentionSeconds
          REPORT_RETENTION_SECONDS: !Ref ReportRetentionSeconds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - Statement:
            - Effect: Allow
              Action:
                - batch:SubmitJob
                - batch:TagResource
              Resource:
                - !Ref WorkerJobDefinition
                - !Ref GpuJobQueue
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref SessionSecret

  LambdaApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseLambdaApi
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebApiFunction.Arn}/invocations
      PayloadFormatVersion: "2.0"

  LambdaApiRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseLambdaApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /api"
      Target: !Sub integrations/${LambdaApiIntegration}

  LambdaApiProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseLambdaApi
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /api/{proxy+}"
      Target: !Sub integrations/${LambdaApiIntegration}

  LambdaApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseLambdaApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: UseApiCustomDomain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: UseApiCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: "$default"

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BatchInstanceRole]

  WorkerJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CourtVisionWorkerArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${ArtifactBucket.Arn}/jobs/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ModelBucket.Arn}/models/*
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Egress-only security group for CourtVision GPU workers
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  GpuComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref BatchMaxVcpus
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        InstanceTypes: [!Ref BatchInstanceType]
        Subnets: !Ref WorkerSubnetIds
        SecurityGroupIds: [!Ref BatchSecurityGroup]
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        Tags:
          Project: CourtVision
          Workload: video-inference
      Tags:
        Project: CourtVision

  GpuJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref GpuComputeEnvironment

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  WorkerJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities: [EC2]
      PropagateTags: true
      RetryStrategy:
        Attempts: 1
      Timeout:
        AttemptDurationSeconds: 3600
      ContainerProperties:
        Image: !Ref WorkerImageUri
        Command: [python, -m, backend.app.batch_job]
        JobRoleArn: !GetAtt WorkerJobRole.Arn
        ResourceRequirements:
          - Type: GPU
            Value: "1"
          - Type: VCPU
            Value: "4"
          - Type: MEMORY
            Value: "14000"
        Environment:
          - Name: COURTVISION_MODEL_BUCKET
            Value: !Ref ModelBucket
          - Name: COURTVISION_MODEL_PREFIX
            Value: models
          - Name: COURTVISION_BALL_DETECTOR_BACKEND
            Value: !Ref BallDetectorBackend
          - Name: COURTVISION_PLAYER_DETECTOR_BACKEND
            Value: ebard
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref WorkerLogs
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: worker

  ApiCluster:
    Type: AWS::ECS::Cluster
    Condition: UseFlaskApi
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Condition: UseFlaskApi
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ApiTaskRole:
    Type: AWS::IAM::Role
    Condition: UseFlaskApi
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CourtVisionApiDataPlane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt JobsTable.Arn
                  - !GetAtt ReportsTable.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${ArtifactBucket.Arn}/jobs/*
              - Effect: Allow
                Action: batch:SubmitJob
                Resource:
                  - !Ref GpuJobQueue
                  - !Ref WorkerJobDefinition
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SessionSecret
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Condition: UseFlaskApi
    Properties:
      RetentionInDays: 30

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: UseFlaskApi
    Properties:
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ApiExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: ENVIRONMENT
              Value: production
            - Name: API_PREFIX
              Value: /api
            - Name: ARTIFACT_BUCKET
              Value: !Ref ArtifactBucket
            - Name: COGNITO_APP_CLIENT_ID
              Value: !Ref UserPoolClient
            - Name: JOBS_TABLE
              Value: !Ref JobsTable
            - Name: REPORTS_TABLE
              Value: !Ref ReportsTable
            - Name: SESSION_SECRET_ARN
              Value: !Ref SessionSecret
            - Name: BATCH_JOB_QUEUE
              Value: !Ref GpuJobQueue
            - Name: BATCH_JOB_DEFINITION
              Value: !Ref WorkerJobDefinition
            - Name: MAX_UPLOAD_BYTES
              Value: !Ref MaxUploadBytes
            - Name: MAX_DURATION_SECONDS
              Value: !Ref MaxDurationSeconds
            - Name: TARGET_FPS
              Value: !Ref TargetFps
            - Name: MAX_WIDTH
              Value: !Ref MaxWidth
            - Name: RESULT_RETENTION_SECONDS
              Value: !Ref ResultRetentionSeconds
            - Name: REPORT_RETENTION_SECONDS
              Value: !Ref ReportRetentionSeconds
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  ApiLoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseFlaskApi
    Properties:
      GroupDescription: Allow the CloudFront origin network to reach the API ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ApiServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseFlaskApi
    Properties:
      GroupDescription: Allow only the CourtVision ALB to reach Flask
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ApiLoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: UseFlaskApi
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref ApiLoadBalancerSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      Type: application

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: UseFlaskApi
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseFlaskApi
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ApiService:
    Type: AWS::ECS::Service
    Condition: UseFlaskApi
    DependsOn: ApiListener
    Properties:
      Cluster: !Ref ApiCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ApiServiceSecurityGroup]
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref ApiTargetGroup

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: UseCloudFront
    Properties:
      CachePolicyConfig:
        Name: !Sub CourtVision-api-no-cache-${AWS::StackName}
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: UseCloudFront
    Properties:
      CachePolicyConfig:
        Name: !Sub CourtVision-web-cache-${AWS::StackName}
        DefaultTTL: 3600
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: UseCloudFront
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub CourtVision-security-${AWS::StackName}
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://*.amazonaws.com; img-src 'self' data: blob:; media-src 'self' blob: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub CourtVision-web-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases: !If
          - UseCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: WebOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !If
              - UseFlaskApi
              - !GetAtt ApiLoadBalancer.DNSName
              - !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: !If [UseFlaskApi, http-only, https-only]
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: WebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref WebCachePolicy
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref SecurityHeaders
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  ApplicationUrl:
    Value: !If
      - UseCloudFront
      - !If
        - UseCustomDomain
        - !Sub https://${CustomDomainName}
        - !Sub https://${Distribution.DomainName}
      - !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CloudFrontDistributionDomainName:
    Condition: UseCloudFront
    Value: !GetAtt Distribution.DomainName
  WebBucketName:
    Condition: UseCloudFront
    Value: !Ref WebBucket
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  ModelBucketName:
    Value: !Ref ModelBucket
  JobsTableName:
    Value: !Ref JobsTable
  ReportsTableName:
    Value: !Ref ReportsTable
  SessionSecretArn:
    Value: !Ref SessionSecret
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoAppClientId:
    Value: !Ref UserPoolClient
  ApiCustomDomainTarget:
    Condition: UseApiCustomDomain
    Value: !GetAtt ApiDomainName.RegionalDomainName
  ApiCustomDomainHostedZoneId:
    Condition: UseApiCustomDomain
    Value: !GetAtt ApiDomainName.RegionalHostedZoneId
  BatchJobQueueArn:
    Value: !Ref GpuJobQueue
  BatchJobDefinitionArn:
    Value: !Ref WorkerJobDefinition
  FlaskLoadBalancerDnsName:
    Condition: UseFlaskApi
    Value: !GetAtt ApiLoadBalancer.DNSName
